name: Deploy

# Every push to main becomes the running demo. Deliberately not gated on the CI workflow:
# the two run in parallel and a deploy of a red commit shows on the CI badge next to it,
# while chaining them would double the wait for the common case of a green push. The
# demo is a portfolio, not production — the recovery from a bad deploy is the next push.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  # Exchanged for a Google access token by workload identity federation — the repository
  # holds no service-account key, only the name of a trust that admits this workflow.
  id-token: write

concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy to Cloud Run
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # The four values live as repository variables rather than in this file, so a fork
    # deploys nowhere and rotating the trust touches no commit. See docs/deploy.md for
    # the one-time gcloud commands that create them.
    env:
      SERVICE: archcompass
      REGION: ${{ vars.GCP_REGION }}
      PROJECT: ${{ vars.GCP_PROJECT_ID }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      - name: Install the gcloud CLI
        uses: google-github-actions/setup-gcloud@v2

      # The rations are set here rather than left to their defaults, which are sized for a
      # public demo. This one is a portfolio link sent to people by name: ten reviews a day
      # across everyone is generous for that, and the model calls behind them are the only
      # part of running this that is billed by the request rather than covered by a free
      # tier. Raising them is an environment change, not a code change.
      #
      # The embedding model is pinned rather than left to the chooser, and it has to be: the
      # image ships a policy index built for exactly this model, and a visitor who selected
      # another would be back to embedding 486 chunks against a hundred-a-minute free tier —
      # minutes of waiting, per visitor, inside a request Cloud Run cuts off at ten. The app
      # refuses to start if the pin and the index disagree, so this line and the committed
      # file are checked against each other on every deploy rather than trusted.
      #
      # `--source .` hands the build to Cloud Build, which runs the repository's own
      # multi-stage Dockerfile — the image the Makefile smoke-tests locally is the image
      # that serves. Flags restate the full configuration on every deploy rather than
      # inheriting it, so this file is the record of how the demo runs.
      - name: Deploy
        run: |
          gcloud run deploy "$SERVICE" \
            --source . \
            --project "$PROJECT" \
            --region "$REGION" \
            --allow-unauthenticated \
            --max-instances 1 \
            --memory 1Gi \
            --concurrency 12 \
            --timeout 600 \
            --set-env-vars ARCHCOMPASS_HOSTED=1,ARCHCOMPASS_PROVIDERS=google,ARCHCOMPASS_SOURCE_HOSTS=github.com,ARCHCOMPASS_GLOBAL_DAILY_RUNS=10,ARCHCOMPASS_SESSION_DAILY_RUNS=3,ARCHCOMPASS_GLOBAL_DAILY_FETCHES=20,ARCHCOMPASS_SESSION_DAILY_FETCHES=3,ARCHCOMPASS_EMBEDDING_PROVIDER=google,ARCHCOMPASS_EMBEDDING_MODEL=gemini-embedding-2,ARCHCOMPASS_EMBEDDING_DIMENSIONS=3072 \
            --set-secrets GOOGLE_API_KEY=archcompass-google-api-key:latest

      - name: Check the deployment answers
        run: |
          url="$(gcloud run services describe "$SERVICE" \
            --project "$PROJECT" --region "$REGION" --format 'value(status.url)')"
          curl --fail --silent --show-error "$url/api/workspace" > /dev/null
          echo "Live: $url"
