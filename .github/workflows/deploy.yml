name: Deploy

# Every push to main becomes the running demo. Deliberately not gated on the CI workflow:
# the two run in parallel and a deploy of a red commit shows on the CI badge next to it,
# while chaining them would double the wait for the common case of a green push. The
# demo is a portfolio, not production — the recovery from a bad deploy is the next push.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  # Exchanged for a Google access token by workload identity federation — the repository
  # holds no service-account key, only the name of a trust that admits this workflow.
  id-token: write

concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy to Cloud Run
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # The four values live as repository variables rather than in this file, so a fork
    # deploys nowhere and rotating the trust touches no commit. See docs/operations.md for
    # the one-time gcloud commands that create them.
    env:
      SERVICE: archcompass
      REGION: ${{ vars.GCP_REGION }}
      PROJECT: ${{ vars.GCP_PROJECT_ID }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      - name: Install the gcloud CLI
        uses: google-github-actions/setup-gcloud@v2

      # The rations are set here rather than left to their defaults, which are sized for a
      # public demo. This one is a portfolio link sent to people by name: ten reviews a day
      # across everyone is generous for that, and the model calls behind them are the only
      # part of running this that is billed by the request rather than covered by a free
      # tier. Raising them is an environment change, not a code change.
      #
      # The embedding model is pinned rather than left to the chooser, and it has to be: the
      # image ships a policy index built for exactly this model, and a visitor who selected
      # another would be back to embedding 486 chunks against a hundred-a-minute free tier —
      # minutes of waiting, per visitor, inside a request Cloud Run cuts off at ten. The app
      # refuses to start if the pin and the index disagree, so this line and the committed
      # file are checked against each other on every deploy rather than trusted.
      #
      # `--source .` hands the build to Cloud Build, which runs the repository's own
      # multi-stage Dockerfile — the image the Makefile smoke-tests locally is the image
      # that serves. Flags restate the full configuration on every deploy rather than
      # inheriting it, so this file is the record of how the demo runs.
      #
      # `--no-cpu-throttling` is what makes a review possible here at all, and its absence
      # was invisible because nothing errors. A review runs on a background thread: the POST
      # that starts one returns 202 and the work continues after it. Cloud Run's default is
      # CPU allocated only while a request is being handled, so between polls that thread had
      # almost no CPU — a run that takes two minutes on a laptop progressed in the few
      # milliseconds each poll bought it, which is what "0 of 50 candidates judged" not
      # moving looks like from the outside. `--timeout 600` never applied to any of it: that
      # bounds one request, and the request was over in a moment.
      #
      # It gets most of the way to the start page's own promise without completing it, and
      # the difference is worth being exact about. "Keeps running in the workspace if you
      # close this tab" is a claim about background work; closing the tab is when the polls
      # stop, and this flag is what stops that meaning the thread stops. What it does not do
      # is keep the instance alive — nothing pins a minimum, so an idle service still scales
      # to zero, and a review still in flight when that happens goes with it. A run that
      # outlives the idle window with nobody watching is not guaranteed to land.
      #
      # `--min-instances 1` is what would finish the promise, and it is deliberately not set:
      # it bills an instance around the clock, which is the wrong trade for a demo that is
      # idle most of the week. The honest reading is that closing the tab is safe for a
      # review of ordinary length and a gamble for a long one.
      #
      # The cost of the flag that IS set: CPU is billed for as long as an instance is alive
      # rather than only while it serves. `--max-instances 1` bounds that to one, and with no
      # minimum an idle demo still scales to zero and bills nothing.
      #
      # The daily caps are all zero, which lifts them. They were sized for a public demo
      # rationing a free tier — three runs a visitor, ten a day for everyone — and this is
      # not that: an instance being shown to somebody who was invited to look at it must not
      # refuse the fourth review of the afternoon. What that trades away is the ceiling on
      # what a day can cost, so the OpenRouter spend is now bounded by the key's own budget
      # and by nothing here. Put a number back to ration it again.
      #
      # Reviews still do not survive the instance. Session workspaces are written under
      # `/tmp` inside the container, which is memory that goes when Cloud Run scales to zero
      # and again on every deploy — so a visitor who comes back to a review from yesterday,
      # or from before the last push, finds it gone. That is not a bug in the workspace: it
      # is this deployment having no disk. Fixing it means a mounted volume and
      # `ARCHCOMPASS_SESSION_ROOT` pointing into it, which is a change to the service rather
      # than to a variable, and is not made here.
      - name: Deploy
        run: |
          gcloud run deploy "$SERVICE" \
            --source . \
            --project "$PROJECT" \
            --region "$REGION" \
            --allow-unauthenticated \
            --max-instances 1 \
            --memory 1Gi \
            --concurrency 12 \
            --timeout 600 \
            --no-cpu-throttling \
            --set-env-vars ARCHCOMPASS_HOSTED=1,ARCHCOMPASS_PROVIDERS=openrouter,ARCHCOMPASS_SOURCE_HOSTS=github.com,ARCHCOMPASS_GLOBAL_DAILY_RUNS=0,ARCHCOMPASS_SESSION_DAILY_RUNS=0,ARCHCOMPASS_GLOBAL_DAILY_FETCHES=0,ARCHCOMPASS_SESSION_DAILY_FETCHES=0,ARCHCOMPASS_EMBEDDING_PROVIDER=openrouter,ARCHCOMPASS_EMBEDDING_MODEL=google/gemini-embedding-2,ARCHCOMPASS_EMBEDDING_DIMENSIONS=3072,ARCHCOMPASS_EMBEDDING_API_KEY_ENV=OPENROUTER_API_KEY \
            --set-secrets OPENROUTER_API_KEY=archcompass-openrouter-api-key:latest

      - name: Check the deployment answers
        run: |
          url="$(gcloud run services describe "$SERVICE" \
            --project "$PROJECT" --region "$REGION" --format 'value(status.url)')"
          curl --fail --silent --show-error "$url/api/workspace" > /dev/null
          echo "Live: $url"
