name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Deterministic checks and build
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.7.6"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version-file: .python-version

      # Before setup-node, which needs pnpm on PATH to resolve its cache directory. The
      # version comes from the `packageManager` field rather than being pinned twice.
      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          package_json_file: frontend/package.json

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install locked Python dependencies
        run: uv sync --locked

      - name: Install locked frontend dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Run deterministic checks
        run: make check

      - name: Build frontend and Python distribution
        run: make build
