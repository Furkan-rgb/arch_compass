[project]
name = "archcompass"
version = "0.1.0"
description = "A context-aware, evidence-grounded software architecture advisor"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12,<3.13"
authors = [{ name = "ArchCompass contributors" }]
dependencies = [
  "fastapi>=0.115,<0.116",
  "httpx>=0.27,<1",
  "pydantic>=2.8,<3",
  "pyyaml>=6.0.2,<7",
  "sqlite-vec>=0.1.6,<0.2",
  "typer>=0.12,<1",
  "uvicorn>=0.34,<0.35",
]

[project.scripts]
archcompass = "archcompass.presentation.cli.app:main"

[dependency-groups]
dev = [
  "pyright>=1.1.390",
  "pytest>=8.3",
  "pytest-cov>=6",
  "ruff>=0.9",
]

[build-system]
requires = ["uv_build>=0.8,<0.9"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "archcompass"
module-root = "src"

[tool.pytest.ini_options]
addopts = '-q --strict-config --strict-markers -m "not ollama and not architectural_quality"'
testpaths = ["tests"]
norecursedirs = ["tests/fixtures"]
markers = [
  "evaluation: deterministic workflow and evidence-integrity evaluation",
  "architectural_quality: optional real-model architectural-quality benchmark",
  "ollama: optional evaluation requiring a locally running Ollama service",
]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101"]

[tool.pyright]
pythonVersion = "3.12"
typeCheckingMode = "strict"
include = ["src"]
exclude = ["tests/fixtures", "eval/cases"]
venvPath = "."
venv = ".venv"
reportMissingTypeStubs = false
reportUnknownMemberType = false

[tool.coverage.run]
branch = true
source = ["archcompass"]

[tool.coverage.report]
show_missing = true
skip_covered = true
