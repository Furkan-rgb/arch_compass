[project]
name = "archcompass"
version = "0.1.0"
description = "A context-aware, evidence-grounded software architecture advisor"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12,<3.13"
authors = [{ name = "ArchCompass contributors" }]
dependencies = [
  "fastapi>=0.115,<0.116",
  "google-genai>=1.0,<2",
  "httpx>=0.27,<1",
  "ollama>=0.6.2",
  "pydantic>=2.8,<3",
  "pyyaml>=6.0.2,<7",
  "typer>=0.12,<1",
  "uvicorn>=0.34,<0.35",
]

[project.scripts]
archcompass = "archcompass.presentation.cli.app:main"

[dependency-groups]
dev = [
  "playwright>=1.61.0",
  "pyright>=1.1.390",
  "pytest>=8.3",
  "pytest-cov>=6",
  "ruff>=0.9",
]

[build-system]
requires = ["uv_build>=0.8,<0.9"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "archcompass"
module-root = "src"

[tool.pytest.ini_options]
addopts = '-q --strict-config --strict-markers -m "not ollama and not google and not browser"'
testpaths = ["tests"]
norecursedirs = ["tests/fixtures"]
markers = [
  "evaluation: deterministic workflow and evidence-integrity evaluation",
  "ollama: optional evaluation requiring a locally running Ollama service",
  "google: optional evaluation requiring a Google AI Studio API key and quota",
  "browser: drives the built workspace in a real browser; needs `make frontend-build` and Playwright",
]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]
# The example repositories are the subject of a review, not source of this project. They
# are shaped to imitate the code they stand for, and resolved as if they were this package
# — so `narration.delivery` inside `narration/` reads as a first-party import and gets
# split from its siblings. Pyright already excludes them for the same reason. A fixture's
# own test asserts it still parses, which is the only property that matters here.
extend-exclude = ["eval/cases"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101"]

[tool.pyright]
pythonVersion = "3.12"
typeCheckingMode = "strict"
include = ["src"]
exclude = ["tests/fixtures", "eval/cases"]
venvPath = "."
venv = ".venv"
reportMissingTypeStubs = false
reportUnknownMemberType = false

[tool.coverage.run]
branch = true
source = ["archcompass"]

[tool.coverage.report]
show_missing = true
skip_covered = true
