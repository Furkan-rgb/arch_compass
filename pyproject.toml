[project]
name = "archcompass"
version = "0.1.0"
description = "A context-aware, evidence-grounded software architecture advisor"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12,<3.13"
authors = [{ name = "ArchCompass contributors" }]
dependencies = [
  "fastapi>=0.115,<0.116",
  "httpx>=0.27,<1",
  "langchain>=1.1,<2",
  "langchain-ollama>=1,<2",
  "langchain-openai>=1,<2",
  "langgraph>=1.1,<2",
  "langgraph-checkpoint-sqlite>=3,<4",
  "ollama>=0.6.2",
  "pydantic>=2.8,<3",
  "pyyaml>=6.0.2,<7",
  "sqlite-vec>=0.1.6,<1",
  "typer>=0.12,<1",
  "uvicorn>=0.34,<0.35",
]

[project.scripts]
archcompass = "archcompass.presentation.cli.app:main"

# Type-aware edge resolution. Optional because the atlas is complete without it — the
# parser's own edges — and because a pinned type checker is a heavy thing to make every
# install carry. The pin is load-bearing: the adapter reads mypy internals that carry no
# stability guarantee, and the version is folded into the analysis config hash, so moving
# it is a decision about the edge set rather than a routine upgrade.
[project.optional-dependencies]
resolution = ["mypy==2.3.0"]

[dependency-groups]
dev = [
  # The same pin as the `resolution` extra, held here as well so `make typecheck` can see
  # the one adapter that imports it. Pyright reads `src/` whole, and a module whose imports
  # are missing reports a hundred unknown types rather than the nothing it should.
  "mypy==2.3.0",
  # The evaluation harness needs it, and `make check` has a tripwire over that harness —
  # which is only a tripwire if it can import what it is watching. The notebook stack it
  # belongs to is held apart below because it is 300 MB; this one is small enough that
  # leaving the harness unimportable in `check` was the more expensive choice. Twice the
  # harness broke and nothing noticed.
  "numpy>=2,<3",
  "playwright>=1.61.0",
  "pyright>=1.1.390",
  "pytest>=8.3",
  "pytest-cov>=6",
  "ruff>=0.9",
]
# What `evaluation/retrieval-evaluation.ipynb` needs and nothing else does. Held apart from
# `dev` because it is a notebook stack — Jupyter, pandas and matplotlib are around 300 MB —
# and `make check` never opens a notebook. `make evaluation` asks for the group by name.
evaluation = [
  "ipykernel>=7,<8",
  "jupyter>=1.1,<2",
  "matplotlib>=3.10,<4",
  "nbconvert>=7.16,<8",
  "pandas>=3,<4",
]

[build-system]
requires = ["uv_build>=0.8,<0.9"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "archcompass"
module-root = "src"

[tool.pytest.ini_options]
addopts = '-q --strict-config --strict-markers -m "not ollama and not openrouter and not browser"'
testpaths = ["tests"]
norecursedirs = ["tests/unit/fixtures"]
markers = [
  "examples: offline checks that the shipped example repositories still present the shapes a review is demonstrated on",
  "ollama: end-to-end review judged and embedded entirely by models on this machine, needing a local Ollama holding the reasoning and embedding models the e2e conftest names",
  "openrouter: end-to-end review against live services, needing an OPENROUTER_API_KEY with credit and a local Ollama holding embeddinggemma for the retrieval side",
  "browser: drives the built workspace in a real browser; needs `make frontend-build` and Playwright",
]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests", "evaluation"]
# The example repositories are the subject of a review, not source of this project. They
# are shaped to imitate the code they stand for, and resolved as if they were this package
# — so `narration.delivery` inside `narration/` reads as a first-party import and gets
# split from its siblings. Pyright already excludes them for the same reason. A fixture's
# own test asserts it still parses, which is the only property that matters here.
# `tests/unit/fixtures` holds repositories built to be analysed rather than to be run: one
# file does not parse and one is not UTF-8, both on purpose, because those are the shapes the
# analyser has to survive and the bundled examples never contain them.
extend-exclude = ["examples/cases", "tests/unit/fixtures"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101"]

[tool.pyright]
pythonVersion = "3.12"
typeCheckingMode = "strict"
include = ["src"]
exclude = ["tests/unit/fixtures", "examples/cases"]
venvPath = "."
venv = ".venv"
reportMissingTypeStubs = false
reportUnknownMemberType = false

# `src` only, and this is a decision rather than an omission.
#
# The cost is real and worth naming: sixteen thousand lines of tests and sixty hand-rolled
# doubles sit outside the type checker, and a hand-rolled double is exactly the thing that
# drifts from the protocol it stands in for without anyone noticing.
#
# Adding `tests` was tried. This configuration is `strict`, and a test that builds a
# deliberately partial stub and hands it in cannot satisfy it: the run produced four
# hundred errors, almost all of them demanding annotations on fixtures that exist to be
# small. Suppressing them one by one would leave the suite harder to read in exchange for
# a guarantee it would no longer really be making. Narrowing the mode for `tests` alone
# does not work either — `executionEnvironments` did not override the global mode here.
#
# So the drift is guarded a different way: `tests/unit/test_boundaries.py` walks the real
# types rather than trusting a double, and a double that stops matching its protocol fails
# the test that uses it. If that stops being enough, the answer is a `basic` run over
# `tests` in its own command, not a strict one with four hundred holes in it.

[tool.coverage.run]
branch = true
source = ["archcompass"]

[tool.coverage.report]
show_missing = true
skip_covered = true
