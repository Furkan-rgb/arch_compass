models:
  reasoning:
    provider: ollama
    model: gemma4:12b
    base_url: http://127.0.0.1:11434
    timeout_seconds: 360
    fast_timeout_seconds: 90
    deep_timeout_seconds: 360
    context_window_tokens: 32768
    max_output_tokens: 16384
    # true requires reasoning, false forbids it, null leaves it to the model. Null
    # here: this file is copied into a workspace whose model is not known in advance,
    # and the model's own default is likelier to suit it than either instruction.
    thinking: null
