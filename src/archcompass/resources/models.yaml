models:
  reasoning:
    provider: ollama
    model: gemma4:12b
    base_url: http://127.0.0.1:11434
    timeout_seconds: 360
    context_window_tokens: 32768
    max_output_tokens: 16384
  embedding:
    provider: ollama
    model: embeddinggemma
    base_url: http://127.0.0.1:11434
    dimensions: 768
    timeout_seconds: 60
retrieval:
  top_k: 6
  max_sections_per_policy: 3
consultation:
  max_zoom_iterations: 3
  max_queries_per_iteration: 8
  max_query_results: 30
  max_excerpt_lines: 80
conversation:
  max_actions_per_question: 8
  max_findings: 12
  max_atlas_nodes: 24
  max_policies: 8
  max_neighbourhood_depth: 2
  max_excerpt_lines: 120
  max_total_excerpt_lines: 180
  max_retrieved_text_characters: 24000
  recent_message_limit: 8
  summarize_after_messages: 12
  summarize_every_messages: 8
  max_summary_characters: 6000
