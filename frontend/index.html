<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- The browser's own chrome, painted to match the page behind it. Rewritten by the script
         below before first paint, and by `lib/theme.ts` on every change after that; the literal
         here is only what a device with no stored preference would flash. Both values are
         `--canvas` from styles.css, copied because a meta tag cannot read a custom property —
         `lib/theme.test.ts` reads this file and the stylesheet and fails if the two disagree. -->
    <meta name="theme-color" content="#f1eeeb" />
    <meta
      name="description"
      content="ArchCompass — architecture review grounded in your code, policies, and decisions."
    />
    <!-- The `.ico` first and the SVG second, which is the order that gets each reader the
         better of the two: a browser picks the last icon it understands, so Chrome and
         Firefox land on the SVG and take its theme-awareness with them, while Safari — which
         paints no SVG icon at all — falls back past it to the bitmap. `favicon.ico` and
         `apple-touch-icon.png` are the same drawing rendered by
         `scripts/generate_favicon_raster.py`; they carry their own ground, because a bitmap
         cannot follow the tab strip between light and dark the way the SVG does. -->
    <link rel="icon" sizes="48x48" href="/favicon.ico" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <!-- The two faces the first paint is set in: IBM Plex Sans's latin subset at 400 and the
         reading weight of IBM Plex Mono. Nothing was preloaded, so the landing page's 62px
         display headline painted in the fallback stack and reflowed once the woff2 arrived —
         the single most visible thing on the one route guaranteed to be somebody's first. The
         extended subsets and the heavier cuts are deliberately not here: none is needed for a
         latin first paint, and a preload for something the page may not use is bandwidth taken
         from something it will. That is a sharper trade-off than it was under a variable face,
         because Plex ships one file per weight — preloading all four would be four requests
         for a paint that needs one. `crossorigin` is mandatory on a font preload; without it
         the request is made in a different mode and the file is fetched twice. -->
    <link
      rel="preload"
      href="/src/assets/fonts/plex-sans-400.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="/src/assets/fonts/plex-mono-400.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <title>ArchCompass — architecture review workbench</title>
    <!-- Wrapped, for the reason `lib/theme.ts` wraps the same two calls: a browser in private
         mode, or an embedded webview with storage switched off, *throws* on `localStorage`
         access rather than returning null. This script runs before anything else on the page,
         so a throw here is a blank document rather than a theme flash — and the whole of what
         it buys is that the page does not flash the wrong theme, which is not worth a page
         that does not load at all. -->
    <script>
      (() => {
        let preference = "system";
        try {
          const saved = localStorage.getItem("archcompass.theme");
          if (saved === "light" || saved === "dark" || saved === "system") preference = saved;
        } catch {}
        let theme = preference;
        if (preference === "system") {
          theme = "light";
          try {
            if (matchMedia("(prefers-color-scheme: dark)").matches) theme = "dark";
          } catch {}
        }
        document.documentElement.dataset.theme = theme;
        document.documentElement.style.colorScheme = theme;
        document
          .querySelector('meta[name="theme-color"]')
          .setAttribute("content", theme === "dark" ? "#0b0a08" : "#f1eeeb");
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
