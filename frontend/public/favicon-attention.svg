<!--
  The same mark with something waiting on it.

  A second file rather than a dot composited onto the first in a canvas. There is no raster icon
  to composite onto — the standing mark is vector — so the canvas route would mean rasterising an
  SVG through an Image, at a device pixel ratio nothing reports for a favicon, to arrive at a
  worse copy of a file that can simply be drawn correctly once. Two files also keep the badge's
  geometry in the same place as the mark's, which is where a change to either belongs.

  The dot is the accent, which in this palette is interaction and never a judgement (styles.css:
  "The accent never carries a judgement"). That matters here: this icon is worn by a run that
  concluded, a run that is holding for answers and a run that failed alike, and a badge in the
  revision amber would be telling the reader their code should change before the review has said
  anything of the sort.

  The mark is masked out under the dot rather than the dot being ringed in a background colour.
  A favicon sits on browser chrome whose colour this file cannot know, so the gutter has to be
  genuinely transparent — a 1.5px ring of it, which is what keeps the dot off the circle at the
  16px the tab actually renders.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <style>
    :root { --mark: #15171a; --dot: #2f5fe0; }
    @media (prefers-color-scheme: dark) { :root { --mark: #e9eae6; --dot: #7c9cff; } }
  </style>
  <mask id="badge-gutter">
    <rect width="32" height="32" fill="#fff" />
    <circle cx="24.5" cy="7.5" r="8" fill="#000" />
  </mask>
  <g mask="url(#badge-gutter)">
    <circle cx="16" cy="16" r="12.5" fill="none" stroke="var(--mark)" stroke-width="2.5" />
    <path d="M21.7 10.3 18.1 18.1 10.3 21.7 13.9 13.9Z" fill="var(--mark)" />
  </g>
  <circle cx="24.5" cy="7.5" r="6.5" fill="var(--dot)" />
</svg>
