# The case a team would actually write.
#
# It states the decision they face, what they want out of it, and the circumstances they
# know. It does not name a finding, a diagnosis or a fix — working out where this
# repository's boundaries are drawn wrongly is the advisor's job, and a case that says it
# first turns the review into a reading-comprehension exercise.

title: Adding a second speech vendor
problem_statement: >-
  This narration service has run on one speech vendor since it was written, and a second
  one is now under contract. Before that work is scheduled, decide which of the boundaries
  already in this code will hold when the second vendor arrives and which will have to be
  reworked anyway.
desired_outcome: >-
  A verdict per boundary, including the verdict that a boundary is already right. What is
  wanted is an honest account of what will and will not survive the second vendor, not a
  redesign.
actors_and_workflows:
  - A listener picks a voice on the web page and starts a book; the service narrates every
    chapter and keeps the audio.
  - One part-time maintainer will add the second vendor next quarter and wants to know in
    advance which parts of the code that touches.
functional_requirements:
  - Offer a listener the voices they may pick from.
  - Refuse a voice the service cannot narrate with, before a vendor call is paid for.
  - Narrate a stored book in the chosen voice and keep the audio.
quality_attributes:
  - Adding the second vendor should be a change to vendor code and to the wiring. It should
    not require editing modules that have no other reason to change.
  - A listener must be narrated the voice they picked, or told plainly that they cannot
    have it.
technical_constraints:
  - Python. Books are kept in SQLite; vendors are reached over HTTP.
  - Application code must not import a database driver directly; this is enforced at review
    and is the reason the storage boundary exists.
  - Which voices an account has is only answerable by asking that vendor at runtime. No
    list written into this repository is correct for both vendors.
organisational_constraints:
  - One part-time maintainer, who pays the cost of every boundary that has to be understood
    before a change can be made.
expected_future_changes:
  - A second speech vendor is under contract and will run alongside the first from next
    quarter. Both stay in service; neither replaces the other.
  - Narrated audio will also stream to the web player in the next release, rather than only
    being written to disk.
  - A hosted Postgres deployment is under discussion for multi-machine use.
non_goals:
  - Listeners defining, uploading or cloning voices of their own.
  - A plugin mechanism for third-party vendors. The two contracted vendors are the whole
    set, and there is no plan for a third.
confirmed_facts:
  - text: >-
      The voices a listener may pick are exactly the ones the configured vendor offers.
      The service curates no list of its own and has no voice that is not a vendor's.
    kind: fact
  - text: >-
      The two vendors' voice names do not overlap, and the second vendor's set is not known
      until its account is provisioned.
    kind: fact
  - text: >-
      Every voice name in the service today belongs to the current vendor's built-in set.
    kind: fact
  - text: >-
      Audio is written once and never rewritten, so a chapter narrated in the wrong voice
      is only noticed by the listener who hears it.
    kind: fact
