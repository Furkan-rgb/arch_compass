# The scoring key for this fixture.
#
# Six of these are boundaries identical to the detector: one abstraction, one
# implementation, every time — the same shape as `boundary-review`. What is being measured
# here is different.
#
# In `boundary-review` the question is whether a boundary absorbs any variation at all.
# Here every boundary sits in front of variation the case says is genuinely coming, so the
# lazy reading clears all six. The discrimination is *placement*: three of these seams are
# at the edge the change will arrive at, and three are vendor-shaped holes cut into modules
# that have no other reason to know a vendor exists. A run that clears all six has read
# "a second vendor is coming" and stopped there.
#
# The repetition this fixture always carried is now scored too. It was written in
# deliberately against the day the second half of the catalogue landed (master plan §8A.3),
# and that day has come: the voice list written out in four modules — one already drifted —
# and the vendor's name spelled out across the web, pre-flight and planning layers are both
# detected now, and both are in the key below.
#
# That makes this fixture the one that tests the discrimination the whole catalogue rests
# on. Six of its nine findings are indirection that may be hiding nothing, and three are
# knowledge with no owner. The advice runs in opposite directions — remove the boundary
# versus give the fact one owner — so a run that reads only one direction cannot score.

boundaries:
  - abstraction: provider.speech.SpeechProvider
    material: false
    because: >-
      The vendor seam, at the edge the second vendor actually arrives at. The case says
      both vendors stay in service, so a second implementation is contracted rather than
      imagined, and this is the one boundary here that is drawn where the variation is.

      Scored not-material deliberately, though a human reading the whole repository would
      add that this seam covers synthesis and nothing else. The judgement stage is shown
      one candidate: this abstraction, its one implementation, the counts, and the case.
      Nothing in that packet says what the seam does or does not cover, so a verdict that
      it is too narrow would be inference promoted to fact — which the contract forbids and
      this key must not reward. The narrowness is visible only across the whole set, and
      the overview is where it belongs.

  - abstraction: library.storage.BookStore
    material: false
    because: >-
      A stated technical constraint says application code must not import a database driver,
      and a hosted Postgres deployment is under discussion. The boundary absorbs a change
      the case expects and enforces a rule the case states.

  - abstraction: narration.delivery.AudioSink
    material: false
    because: >-
      Streaming to the web player is scheduled for the next release and disk output stays.
      The second implementation is planned, not hypothetical.

  - abstraction: frontend.catalogue.VoiceListSource
    material: true
    because: >-
      A seam over which voices exist, cut into the web layer, whose only implementation
      answers for one vendor. The case says that answer belongs to whichever vendor is
      configured and is only knowable by asking it, so this boundary does not absorb the
      second vendor — it guarantees the web layer is edited when it lands.

  - abstraction: preflight.voices.VoiceValidator
    material: true
    because: >-
      The same question again, one module along. Deciding whether a voice exists is the
      vendor's answer, and a pre-flight check holding its own version of it is a second
      place the second vendor has to be applied.

  - abstraction: narration.planning.VoiceResolver
    material: true
    because: >-
      The third copy of the same seam. It also holds the case's quality attribute in its
      hands — a listener must get the voice they picked or be told they cannot — and a
      resolver that answers from its own idea of the vendor's voices can honour neither
      vendor reliably.

  - abstraction: frontend.catalogue.BUILT_IN_VOICES
    material: true
    because: >-
      The same voice list stated in four modules, and the copies have already drifted out of
      step with one another. The case says outright that which voices an account has is only
      answerable by asking the vendor at runtime and that no list written into this
      repository is correct for both vendors, so every copy is wrong and the drift is the
      proof that nothing keeps them together.

      The advice runs the opposite way from the boundaries above: this is not indirection to
      remove, it is a fact with no owner. A run that reports it as an abstraction to delete
      has read the shape and missed the direction.

  - abstraction: provider.qwen
    material: true
    because: >-
      The vendor sits behind a seam the case calls correct — `SpeechProvider` is scored
      not-material above — and its name is nonetheless spelled out in five modules outside
      the package that owns it. The case's quality attribute is explicit: adding the second
      vendor should be a change to vendor code and wiring, and should not require editing
      modules that have no other reason to change. Each of those five is such a module.

      Scored material even though a mention is only a name. The discrimination the key wants
      is that a boundary existing is not the same as a boundary being used, and this is the
      finding that says so.
