# The case a team would actually write.
#
# It states the decision they face and the circumstances they know. It never names a
# finding: working out which of this repository's shapes are wrong is the advisor's job,
# and a case that says it first turns the review into a reading-comprehension exercise.

title: A second narration voice, and a settled text pipeline
problem_statement: >-
  This tool turns books into audiobooks in two steps: a local language model rewrites each
  chapter into speakable passages, then a text-to-speech backend narrates them. A second
  speech vendor is now under contract and will run alongside the current one. Before that
  work is scheduled, decide which of the structures already in this code will hold when it
  arrives, and which will have to be reworked anyway.
desired_outcome: >-
  A verdict per finding, including the verdict that something is already right. What is
  wanted is an honest account of what will and will not survive the second speech vendor,
  not a redesign.
actors_and_workflows:
  - A reader points the tool at a book, picks a narrator voice, and gets an audio file.
  - One part-time maintainer will add the second speech vendor next quarter and wants to
    know in advance which parts of the code that touches.
functional_requirements:
  - Rewrite a chapter into passages a narrator can read aloud.
  - Offer the narrator voices the configured speech backend can actually produce.
  - Narrate a book in the chosen voice and write one audio file.
  - Fail before any model is loaded when the environment cannot support a run.
quality_attributes:
  - Adding the second speech vendor should be a change to that vendor's own module and to
    the wiring. It should not require editing modules that have no other reason to change.
  - A run that cannot succeed should say so before it spends time or disk on a model.
technical_constraints:
  - Python. Everything runs on one machine; there is no server and no queue.
  - The speech backends are reached through their own Python packages, which are heavy and
    are imported only once a run has been accepted.
  - Whether a given voice exists is answerable only by asking the configured speech
    backend. No list written into this repository is correct for both vendors.
  - Audio is written at one sample rate throughout; the writer and the settings must agree
    or the finished file is silently wrong.
organisational_constraints:
  - One part-time maintainer, who pays the cost of every structure that has to be
    understood before a change can be made.
expected_future_changes:
  - A second speech vendor, under contract, running alongside the current one. Both stay in
    service and a reader may be narrated by either.
  - More books and longer chapters, which changes nothing structural.
non_goals:
  - >-
    A second text-preparation runtime. The local language-model step is settled — it is an
    internal implementation detail nobody has asked to vary, and the team has decided not
    to support an alternative.
  - Running any part of this as a hosted service.
confirmed_facts:
  - text: >-
      The second speech vendor is contracted and scheduled for next quarter.
    kind: fact
  - text: >-
      No alternative text-preparation runtime is planned, and supporting one is an explicit
      non-goal.
    kind: fact
  - text: >-
      The two registries are independent of one another: each names the backends of its own
      step, and neither has ever needed to know what the other holds.
    kind: fact
assumptions:
  - text: >-
      The second speech vendor will expose the same operations as the current one, since
      the contract was written around them.
    kind: assumption
unresolved_questions:
  - text: >-
      Whether both speech vendors will be available on the same machine at once, or
      selected per run.
    kind: question
