# What this example grades: which verdicts should say they rest on something.
#
# Deliberately not `expected.yaml`. That file grades verdicts, and two of the verdicts here
# are contingent by construction — asserting a right answer for them would settle, in a
# scoring key, the exact question the case refuses to settle. What can be graded without
# doing that is *where the advisor noticed the silence*, which is this file.
#
# The discrimination is the point. Two boundaries turn on one unstated fact and three are
# decidable from what the case already says. A run that hinges all five has learned to hedge
# and tells the reader nothing about where to look; a run that hinges none has spent the
# silence without noticing and will present a coin-flip as a finding. Both score badly here,
# which is what separates them from an advisor.
#
# `questions` is a count rather than a wording. The two hinged boundaries rest on the same
# fact, so a run that consolidates asks once and a run that does not asks twice — and the
# consolidation is most of what the overview stage is for. Note that the answer moves them
# in *opposite* directions: a second warehouse justifies the port and condemns the leak.
# That is realistic, and it is the harder thing to merge.

name: warehouse-sync

hinged:
  - abstraction: sync.ports.WarehouseFeed
    because: >-
      One implementation, at an HTTP edge, with no test substituting it and nothing in the
      case naming a second warehouse. Whether the indirection is earning its keep is
      exactly the question the case does not answer: told a second warehouse is coming,
      this is the seam it arrives at; told the current one is permanent, it is a layer in
      front of one concrete thing.
  - abstraction: warehouse.northwind
    because: >-
      The digest names the vendor in prose an operator reads. With one warehouse forever
      that is untidy and free; with a second arriving it is a module that has to be edited
      and a line that becomes wrong. Same unstated fact as the feed boundary, moving the
      verdict the other way.

not_hinged:
  - abstraction: sync.ports.StockLedger
    because: >-
      The case states the constraint that puts it there — application code must not import
      a database driver, checked at review. Nothing is silent here, and a hinge would be
      hedging against a constraint the case spells out.
  - abstraction: reporting.digest.BATCH_SIZE
    because: >-
      Two modules state the same number for the same reason, and the case gives that reason
      as a technical constraint: the warehouse's page limit. It is one fact with no owner
      whatever else changes, so nothing about the future moves this verdict.
  - abstraction: reporting.digest.RETRY_LIMIT
    because: >-
      Two facts that happen to share a name — HTTP request retries and digest rebuild
      attempts — with different values and different reasons, both stated in the code and
      supported by the case's own quality attributes. Merging them would invent a coupling.
      No future fact changes that.

#: How many questions the overview should compose from the hinges above. Both hinged
#: boundaries rest on the same fact, so the answer is one.
questions: 1
