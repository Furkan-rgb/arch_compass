# The case written by someone who has not been asked the right question yet.
#
# Unlike `speech-vendor`, this one is deliberately incomplete, and incomplete in a specific
# place. It is detailed about how the service is built, what it is bound by and what is
# ruled out — so most of its boundaries are decidable from what it says. It is silent about
# exactly one thing: whether a second warehouse is coming. Two of its five boundaries turn
# on that silence and three do not.
#
# That split is what this example measures. A run that hedges every verdict has learned to
# say "it depends" and is useless; a run that hedges none has spent the silence without
# noticing it and will present a coin-flip as a finding. Between them is the behaviour worth
# having: judge everything, and name the one thing that would change your mind.
#
# There is deliberately no expected.yaml. Two of these verdicts are genuinely contingent on
# a fact this case withholds, so a scored answer for them would be asserting a right answer
# to a question the case refuses to settle. `elicitation.yaml` holds what *can* be graded:
# which boundaries should say they turn on something, and which should not.

title: Keeping stock in step with the warehouse
problem_statement: >-
  This service reconciles the stock levels we believe we have against what the warehouse
  reports, and mails the operator a digest of what changed overnight. It has grown for
  about two years and I have never looked at its structure properly. I want to know which
  of the boundaries in it are doing real work and which are just shape I have been
  carrying around.
desired_outcome: >-
  A verdict per boundary, including the verdict that a boundary is already right. I would
  rather be told that four of five are fine than be handed a redesign.
actors_and_workflows:
  - A nightly job reconciles every SKU against the warehouse feed and writes the corrected
    levels back to the ledger.
  - One operator reads the digest each morning and chases anything that looks wrong.
functional_requirements:
  - Read the current stock levels the warehouse reports.
  - Write the corrected levels back to our own ledger.
  - Mail the operator one digest a night, listing only what changed.
quality_attributes:
  - The nightly run must finish inside its window. Reconciliation is paged so a slow
    warehouse response cannot hold the whole run open.
  - A partial digest is worse than a late one. The operator acts on it, and a missing line
    reads as "nothing changed" rather than as a failure.
technical_constraints:
  - Python. The ledger is SQLite on the same host; the warehouse is reached over HTTP.
  - Application code must not import a database driver directly. This is checked at review
    and is the reason the ledger sits behind a boundary.
  - The warehouse's stock endpoint is paged and will not return more than 200 rows at once.
organisational_constraints:
  - One part-time maintainer, who pays the cost of every boundary that has to be understood
    before a change can be made.
non_goals:
  - Writing stock levels back to the warehouse. This service reads from it and never
    corrects it.
  - Letting the operator edit levels from the digest. The digest is a mail, and it stays a
    mail.
confirmed_facts:
  - text: >-
      The digest is plain text and is mailed. There is no web page, and no plan for one.
    kind: fact
  - text: >-
      Reconciliation runs once a night, on a schedule, and is never triggered by hand.
    kind: fact
  - text: >-
      A rebuilt digest is byte-for-byte the same as the one it replaces, so rebuilding
      after a failure is safe and is done rather than failing the run.
    kind: fact
assumptions:
  - text: >-
      The warehouse's page limit is stable. It has not changed in the two years this has
      been running.
    kind: assumption
