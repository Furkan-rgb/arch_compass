title: Greenfield audiobook system
problem_statement: Build an audiobook application using Qwen TTS with voice design, cloning, and built-in voices.
desired_outcome: Stable pipeline boundaries that allow credible future providers without a universal plugin platform.
actors_and_workflows:
  - A user ingests a book and resumes long-running narration.
functional_requirements:
  - Book ingestion
  - Text preparation and chunking
  - Voice design and cloning
  - Narration
quality_attributes:
  - Long-running jobs are resumable
technical_constraints:
  - One local GPU
  - Qwen is the initial provider
expected_future_changes:
  - Hosted providers may be added later
non_goals:
  - Universal dynamic plugin marketplace
confirmed_facts:
  - text: Qwen is the initial provider.
    kind: fact

