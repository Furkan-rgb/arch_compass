# Local models through Ollama. Select it for a run with either:
#   ARCHCOMPASS_MODELS_CONFIG=config/models.ollama.yaml
#   archcompass <command> --models-config config/models.ollama.yaml
#
# `config/models.google.yaml` is the hosted alternative; neither is implicit, so a run
# always says which models produced it.
models:
  reasoning:
    provider: ollama
    model: gemma4:26b
    base_url: http://127.0.0.1:11434
    timeout_seconds: 360
    context_window_tokens: 131072
    max_output_tokens: 16384
    thinking: null
