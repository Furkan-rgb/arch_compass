# Local models through Ollama. Select it for a run with either:
#   ARCHCOMPASS_MODELS_CONFIG=config/models.ollama.yaml
#   archcompass <command> --models-config config/models.ollama.yaml
#
# `config/models.google.yaml` is the hosted alternative; neither is implicit, so a run
# always says which models produced it.
models:
  reasoning:
    provider: ollama
    model: gemma4:26b
    base_url: http://127.0.0.1:11434
    timeout_seconds: 360
    fast_timeout_seconds: 90
    deep_timeout_seconds: 360
    context_window_tokens: 131072
    max_output_tokens: 8192
    # true requires reasoning, false forbids it, null leaves it to the model. Null here
    # from measurement, not principle: on the scored example gemma4:26b took 510s and
    # scored 4/6 with true — leaking a statement-shaped JSON object into the overview's
    # prose, schema-valid and malformed — took 40s and scored 3/6 with false, and took
    # ~250s and scored 5-6/6 left to itself. Thinking tokens come out of
    # max_output_tokens either way.
    thinking: null
  embedding:
    provider: ollama
    model: embeddinggemma
    base_url: http://127.0.0.1:11434
    dimensions: 768
    timeout_seconds: 60
retrieval:
  top_k: 6
  max_sections_per_policy: 3
