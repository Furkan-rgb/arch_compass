models:
  reasoning:
    provider: ollama
    model: gemma4:26b
    base_url: http://127.0.0.1:11434
    timeout_seconds: 360
    fast_timeout_seconds: 90
    deep_timeout_seconds: 360
    # Every token reserved for output is taken from the input budget, and a focused
    # concern packet runs to ~29k tokens. The previous 32768/16384 pair left 16384 for
    # input and could not complete a consultation.
    context_window_tokens: 131072
    max_output_tokens: 8192
  embedding:
    provider: ollama
    model: embeddinggemma
    base_url: http://127.0.0.1:11434
    dimensions: 768
    timeout_seconds: 60
retrieval:
  top_k: 6
  max_sections_per_policy: 3
consultation:
  max_zoom_iterations: 3
  max_queries_per_iteration: 8
  max_query_results: 30
  max_excerpt_lines: 80
