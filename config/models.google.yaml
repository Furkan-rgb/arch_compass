# Google AI Studio, using models with a free tier.
#
# Select it for a run with either:
#   ARCHCOMPASS_MODELS_CONFIG=config/models.google.yaml
#   archcompass <command> --models-config config/models.google.yaml
#
# The API key is read from the environment variable named below, which
# `.env` at the workspace root supplies. The key itself never lives in this file.
models:
  reasoning:
    provider: google
    model: gemini-3.6-flash
    api_key_env: GOOGLE_API_KEY
    timeout_seconds: 360
    # Deliberately well below the model's advertised window. This number only feeds the
    # pre-flight budget check, where under-stating refuses an oversize request with an
    # explicit message and over-stating lets one through to be truncated. A judgement
    # carries the whole policy corpus at roughly 21k characters, so this is ample.
    context_window_tokens: 131072
    # Gemini spends thinking tokens from this same allowance, so a stage needs noticeably
    # more headroom here than the response JSON alone would suggest.
    max_output_tokens: 32768
    # true requires reasoning, false forbids it, null leaves it to the model. Gemini
    # chooses its own level when required to think, and spends those tokens from the
    # allowance above — which is why it is larger here than in the Ollama configuration.
    thinking: true
